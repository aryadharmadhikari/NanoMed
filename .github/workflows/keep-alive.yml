name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */2 * *' # Every 2 days at midnight UTC (redundancy against GitHub scheduling delays)
  workflow_dispatch: # Also allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Ping Supabase via direct DB connection
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          echo "Connecting to Supabase database directly..."
          result=$(psql "$DATABASE_URL" -c "SELECT 'alive' AS status;" --tuples-only --no-align)
          echo "Query result: $result"
          if [ "$result" != "alive" ]; then
            echo "Unexpected result from database: $result"
            exit 1
          fi
          echo "✅ Direct DB ping successful — Supabase is alive."
